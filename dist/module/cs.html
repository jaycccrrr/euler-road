:\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[31573,[\"/_next/static/chunks/93b8a4061a4edf27.js\",\"/_next/static/chunks/6454366117e44fa3.js\",\"/_next/static/chunks/bf55b9c8f6d077d0.js\",\"/_next/static/chunks/642ab56133dc442d.js\",\"/_next/static/chunks/7fcec477619ebfc7.js\",\"/_next/static/chunks/6c68d6ebf8969394.js\",\"/_next/static/chunks/34dcd0e51e711b6d.js\"],\"default\"]\ne:T83c,## 计算机网络\n\n### 网络体系结构\n**OSI七层模型**：\n1. 物理层：比特传输\n2. 数据链路层：帧传输、差错控制\n3. 网络层：路由选择、IP\n4. 传输层：端到端连接、TCP/UDP\n5. 会话层：会话管理\n6. 表示层：数据格式转换\n7. 应用层：为用户应用程序提供服务\n\n**TCP/IP四层模型**：\n- 网络接口层、网际层、传输层、应用层\n\n### 物理层\n**传输介质**：双绞线、同轴电缆、光纤、无线\n\n**数据通信基础**：\n- 奈奎斯特定理、香农定理\n- 编码：曼彻斯特编码、差分曼彻斯特编码\n- 调制：ASK、FSK、PSK\n\n**多路复用**：FDM、TDM、WDM、CDM\n\n### 数据链路层\n**组帧**：字符计数法、字符填充法、零比特填充法、违规编码法\n\n**差错控制**：\n- 检错：奇偶校验、CRC循环冗余检验\n- 纠错：海明码\n\n**流量控制**：停止-等待、滑动窗口\n\n**可靠传输机制**：确认、超时重传\n\n**介质访问控制**：\n- 信道划分：FDM、TDM、CDM\n- 随机访问：ALOHA、CSMA、CSMA/CD、CSMA/CA\n- 轮询访问：令牌传递\n\n**局域网**：以太网(IEEE 802.3)、无线局域网(IEEE 802.11)\n\n**数据链路层设备**：网桥、交换机\n\n### 网络层\n**IP协议**：\n- IPv4地址分类：A、B、C、D、E类\n- 子网划分、CIDR\n- NAT网络地址转换\n- IPv6：128位地址\n\n**路由算法**：\n- 静态路由、动态路由\n- 距离向量算法(RIP)\n- 链路状态算法(OSPF)\n- BGP协议\n\n**IP组播、移动IP**\n\n**网络层设备**：路由器\n\n### 传输层\n**UDP**：无连接、不可靠、开销小\n- 首部8字节\n\n**TCP**：面向连接、可靠传输\n- 三次握手建立连接\n- 四次挥手释放连接\n- 可靠传输：序号、确认、重传\n- 流量控制：滑动窗口\n- 拥塞控制：慢开始、拥塞避免、快重传、快恢复\n\n### 应用层\n**DNS**：域名解析系统\n\n**FTP**：文件传输协议\n\n**HTTP**：超文本传输协议\n- 无状态、持久连接\n- 方法：GET、POST、PUT、DELETE等\n- 状态码：1xx-5xx\n\n**HTTPS**：HTTP + SSL/TLS\n\n**电子邮件**：SMTP、POP3、IMAPf:T8dc,## 计算机组成原理\n\n### 计算机系统概述\n**冯·诺依曼体系结构**：\n- 存储程序思想\n- 五大部件：运算器、控制器、存储器、输入设备、输出设备\n- 以运算器为中心\n\n**计算机性能指标**：\n- 字长、主频、CPI、MIPS、MFLOPS\n- 吞吐量、响应时间、CPU时钟周期\n\n### 数据的表示与运算\n**数值表示**：\n- 原码、反码、补码、移码\n- 定点数、浮点数(IEEE 754标准)\n\n**运算方法**：\n- 定点数加减乘除\n- 浮点数加减乘除\n- ALU：加法器、移位器\n\n**校验码**：\n- 奇偶校验码\n- 海明校验码\n- 循环冗余校验码(CRC)\n\n### 存储系统\n**存储器分类**：\n- 按位置：主存、辅存、缓存\n- 按材料：磁表面、半导体、光存储\n- 按存取方式：RAM、ROM、顺序存取、直接存取\n\n**主存储器**：\n- SRAM：静态，速度快，用作Cache\n- DRAM：动态，容量大，用作主存\n- 存储器与CPU的连接\n\n**多模块存储器**：单体多字、多体并行\n\n**Cache**：\n- 局部性原理\n- 映射方式：直接映射、全相联、组相联\n- 替换算法：LRU、FIFO、随机\n- 写策略：写直达、写回、写分配、非写分配\n\n**虚拟存储器**：页式、段式、段页式\n\n### 指令系统\n**指令格式**：操作码、地址码\n\n**寻址方式**：\n- 立即寻址、直接寻址、间接寻址\n- 寄存器寻址、寄存器间接寻址\n- 基址寻址、变址寻址、相对寻址\n- 堆栈寻址\n\n**CISC与RISC**：\n- CISC：复杂指令集，x86\n- RISC：精简指令集，ARM、MIPS\n\n### CPU设计\n**数据通路**：单总线、多总线\n\n**控制器**：\n- 硬布线控"])</script><script>self.__next_f.push([1,"制器\n- 微程序控制器\n\n**指令流水线**：\n- 五段流水线：取指、译码/读寄存器、执行、访存、写回\n- 冒险：结构冒险、数据冒险、控制冒险\n- 超标量、超流水、超长指令字\n\n### 总线\n**总线分类**：数据总线、地址总线、控制总线\n\n**总线仲裁**：集中式、分布式\n\n**总线标准**：ISA、EISA、VESA、PCI、PCIe、USB\n\n### I/O系统\n**I/O接口**：数据缓冲、错误检测、控制和定时\n\n**I/O方式**：\n- 程序查询\n- 程序中断\n- DMA\n- 通道\n\n**中断系统**：\n- 中断响应、中断处理、多重中断\n- 中断屏蔽字10:Tb13,## 软件工程\n\n### 软件工程概述\n**软件危机**：开发成本高、质量难保证、进度难控制、维护困难\n\n**软件工程三要素**：\n- 方法：完成软件开发任务的技术\n- 工具：支撑方法的工具\n- 过程：将方法和工具结合以达到合理、及时地进行软件开发\n\n**软件生命周期**：\n- 定义期：问题定义、可行性研究、需求分析\n- 开发期：总体设计、详细设计、编码与测试\n- 维护期：运行维护\n\n### 软件开发模型\n**瀑布模型**：线性顺序，阶段分明，文档驱动\n\n**快速原型模型**：快速构建原型，用户反馈，逐步求精\n\n**增量模型**：分批次交付，降低风险\n\n**螺旋模型**：风险驱动，迭代开发\n\n**敏捷开发**：\n- 价值观：个体和交互、可工作的软件、客户合作、响应变化\n- 方法：Scrum、极限编程(XP)\n- 实践：结对编程、持续集成、测试驱动开发(TDD)\n\n### 需求分析\n**需求类型**：功能需求、非功能需求（性能、安全、可靠性）\n\n**需求获取方法**：访谈、问卷、观察、原型\n\n**需求规格说明(SRS)**\n\n**需求验证与变更管理**\n\n### 软件设计\n**设计原则**：\n- 模块化\n- 高内聚、低耦合\n- 信息隐藏\n- 抽象\n\n**面向对象设计原则（SOLID）**：\n- S：单一职责原则\n- O：开闭原则\n- L：里氏替换原则\n- I：接口隔离原则\n- D：依赖倒置原则\n\n**设计模式**：\n- 创建型：单例、工厂、抽象工厂、建造者、原型\n- 结构型：适配器、桥接、组合、装饰、外观、享元、代理\n- 行为型：观察者、策略、模板方法、命令、状态、责任链等\n\n**UML**：\n- 用例图、类图、对象图\n- 序列图、协作图、状态图、活动图\n- 构件图、部署图\n\n### 软件测试\n**测试级别**：\n- 单元测试\n- 集成测试\n- 系统测试\n- 验收测试\n\n**测试方法**：\n- 白盒测试：语句覆盖、判定覆盖、条件覆盖、路径覆盖\n- 黑盒测试：等价类划分、边界值分析、错误推测、因果图\n\n**调试技术**：\n- 暴力法、回溯法、原因排除法\n\n### 软件维护\n**维护类型**：\n- 改正性维护（纠错）\n- 适应性维护（适应环境变化）\n- 完善性维护（增强功能）\n- 预防性维护（预防未来问题）\n\n**可维护性因素**：可理解性、可测试性、可修改性\n\n**重构**：在不改变外部行为的前提下改善代码结构\n\n### 软件项目管理\n**项目估算**：代码行估算、功能点估算、COCOMO模型\n\n**进度计划**：\n- 工作分解结构(WBS)\n- Gantt图\n- PERT图（关键路径法）\n\n**风险管理**：风险识别、分析、规划、监控\n\n**配置管理**：版本控制、变更控制、配置审计\n\n**质量管理**：软件质量属性、质量保证、评审与审计"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Ld\",null,{\"module\":{\"id\":\"cs\",\"name\":\"计算机\",\"category\":\"cs\",\"icon\":\"💻\",\"color\":\"from-emerald-400 to-emerald-600\",\"description\":\"计算机科学与技术，数据结构、算法、操作系统、网络\",\"topics\":[{\"id\":\"cs-1\",\"title\":\"数据结构与算法\",\"difficulty\":3,\"content\":\"## 数据结构与算法\\n\\n### 算法基础\\n**算法的特性**：有穷性、确定性、可行性、输入、输出\\n\\n**算法复杂度**：\\n- 时间复杂度：T(n) = O(f(n))\\n- 空间复杂度：S(n) = O(f(n))\\n- 常见复杂度：O(1) \u003c O(logn) \u003c O(n) \u003c O(nlogn) \u003c O(n²) \u003c O(n³) \u003c O(2ⁿ)\\n\\n### 线性结构\\n**数组**：连续存储，随机访问O(1)，插入删除O(n)\\n\\n**链表**：\\n- 单链表、双链表、循环链表\\n- 插入删除O(1)，查找O(n)\\n\\n**栈**：后进先出(LIFO)\\n- 应用：括号匹配、表达式求值、递归实现\\n\\n**队列**：先进先出(FIFO)\\n- 普通队列、双端队列、优先队列\\n\\n### 树与二叉树\\n**二叉树**：\\n- 性质：第i层最多2^(i-1)个结点，深度为k的二叉树最多2^k-1个结点\\n- 满二叉树、完全二叉树\\n- 遍历：前序、中序、后序、层序\\n\\n**二叉搜索树(BST)**：\\n- 左子树 \u003c 根 \u003c 右子树\\n- 查找、插入、删除平均O(logn)，最坏O(n)\\n\\n**平衡二叉树**：\\n- AVL树：左右子树高度差不超过1\\n- 红黑树\\n\\n**堆**：\\n- 大根堆、小根堆\\n- 堆排序、Top K问题\\n\\n**B树与B+树**：\\n- 多路平衡搜索树\\n- 数据库索引\\n\\n### 图\\n**存储方式**：邻接矩阵、邻接表\\n\\n**遍历**：\\n- 深度优先搜索(DFS)\\n- 广度优先搜索(BFS)\\n\\n**最短路径**：\\n- Dijkstra算法（单源，非负权）\\n- Bellman-Ford算法（负权）\\n- Floyd算法（全源）\\n\\n**最小生成树**：\\n- Prim算法\\n- Kruskal算法\\n\\n**拓扑排序**：有向无环图(DAG)的线性排序\\n\\n### 排序算法\\n**比较排序**：\\n- 冒泡排序、选择排序、插入排序：O(n²)\\n- 归并排序、快速排序、堆排序：O(nlogn)\\n\\n**非比较排序**：\\n- 计数排序、基数排序、桶排序：O(n)\\n\\n### 查找算法\\n- 顺序查找：O(n)\\n- 二分查找：O(logn)\\n- 哈希查找：O(1)平均\\n- 二叉搜索树：O(logn)平均\"},{\"id\":\"cs-2\",\"title\":\"操作系统\",\"difficulty\":4,\"content\":\"## 操作系统\\n\\n### 操作系统概述\\n**功能**：处理器管理、存储器管理、设备管理、文件管理、用户接口\\n\\n**特征**：并发、共享、虚拟、异步\\n\\n**发展阶段**：批处理、分时、实时、网络、分布式\\n\\n### 进程管理\\n**进程与线程**：\\n- 进程：资源分配的基本单位\\n- 线程：CPU调度的基本单位\\n- 进程状态：就绪、运行、阻塞\\n\\n**进程调度算法**：\\n- 先来先服务(FCFS)\\n- 短作业优先(SJF)\\n- 优先级调度\\n- 时间片轮转(RR)\\n- 多级反馈队列\\n\\n**进程同步与互斥**：\\n- 临界区、互斥、同步\\n- 信号量(P/V操作)\\n- 管程\\n- 经典问题：生产者-消费者、读者-写者、哲学家进餐\\n\\n**死锁**：\\n- 必要条件：互斥、占有等待、不可剥夺、循环等待\\n- 预防、避免（银行家算法）、检测、解除\\n\\n### 内存管理\\n**连续分配**：单一连续、固定分区、动态分区\\n\\n**非连续分配**：\\n- 分页：页表、地址变换、快表(TLB)\\n- 分段：段表、共享与保护\\n- 段页式\\n\\n**虚拟内存**：\\n- 请求分页、请求分段\\n- 页面置换算法：FIFO、LRU、LFU、Clock\\n- 页面抖动(Thrashing)\\n\\n### 文件系统\\n**文件逻辑结构**：流式、记录式\\n\\n**文件物理结构**：\\n- 连续分配\\n- 链接分配\\n- 索引分配\\n\\n**目录管理**：单级、两级、树形、图形\\n\\n**文件存储空间管理**：位示图、空闲表、成组链接法\\n\\n**磁盘调度算法**：\\n- FCFS、SSTF、SCAN、C-SCAN、LOOK、C-LOOK\\n\\n### I/O系统\\n**I/O控制方式**：程序直接控制、中断驱动、DMA、通道\\n\\n**缓冲管理**：单缓冲、双缓冲、循环缓冲、缓冲池\\n\\n**设备分配**：独占设备、共享设备、虚拟设备(SPOOLing技术)\"},{\"id\":\"cs-3\",\"title\":\"计算机网络\",\"difficulty\":4,\"content\":\"$e\"},{\"id\":\"cs-4\",\"title\":\"计算机组成原理\",\"difficulty\":4,\"content\":\"$f\"},{\"id\":\"cs-5\",\"title\":\"数据库系统\",\"difficulty\":3,\"content\":\"## 数据库系统\\n\\n### 数据库概述\\n**数据模型**：\\n- 概念模型：E-R模型（实体-联系模型）\\n- 逻辑模型：层次模型、网状模型、关系模型、面向对象模型\\n\\n**数据库三级模式**：\\n- 外模式（用户视图）\\n- 模式（逻辑结构）\\n- 内模式（物理存储）\\n\\n**两级映像与数据独立性**：\\n- 外模式/模式映像：逻辑独立性\\n- 模式/内模式映像：物理独立性\\n\\n### 关系数据库\\n**关系模型基本概念**：\\n- 关系、元组、属性、主码、外码\\n- 关系的完整性：实体完整性、参照完整性、用户定义完整性\\n\\n**关系代数**：\\n- 传统集合运算：并、差、交、笛卡尔积\\n- 专门关系运算：选择σ、投影π、连接⋈、除÷\\n\\n**关系演算**：元组关系演算、域关系演算\\n\\n### SQL语言\\n**数据定义**：CREATE、ALTER、DROP\\n\\n**数据查询**：SELECT\\n- 单表查询、连接查询、嵌套查询\\n- 集合查询\\n- 分组与聚合：GROUP BY、HAVING\\n\\n**数据更新**：INSERT、UPDATE、DELETE\\n\\n**视图**：虚拟表，提供数据安全性与逻辑独立性\\n\\n**索引**：B+树索引、哈希索引\\n\\n### 数据库设计\\n**设计步骤**：\\n1. 需求分析\\n2. 概念结构设计（E-R图）\\n3. 逻辑结构设计（E-R图转关系模式）\\n4. 物理结构设计\\n5. 数据库实施\\n6. 数据库运行与维护\\n\\n**E-R模型**：\\n- 实体、属性、联系（1:1、1:n、m:n）\\n- E-R图合并时的冲突：属性冲突、命名冲突、结构冲突\\n\\n**关系模式规范化**：\\n- 函数依赖、部分依赖、传递依赖\\n- 范式：1NF、2NF、3NF、BCNF、4NF\\n- 关系模式分解\\n\\n### 数据库保护\\n**事务**：\\n- ACID特性：原子性、一致性、隔离性、持久性\\n- 事务状态：活动、部分提交、提交、失败、中止\\n\\n**并发控制**：\\n- 并发问题：丢失修改、脏读、不可重复读、幻读\\n- 封锁：排他锁(X)、共享锁(S)\\n- 封锁协议：一级、二级、三级\\n- 死锁预防与检测\\n- 并发调度：可串行化、两段锁协议\\n\\n**恢复技术**：\\n- 故障种类：事务故障、系统故障、介质故障\\n- 恢复原理：冗余\\n- 恢复技术：数据转储、日志文件、检查点\"},{\"id\":\"cs-6\",\"title\":\"编译原理\",\"difficulty\":5,\"content\":\"## 编译原理\\n\\n### 编译程序概述\\n**编译过程**：\\n1. 词法分析\\n2. 语法分析\\n3. 语义分析与中间代码生成\\n4. 代码优化\\n5. 目标代码生成\\n\\n**编译程序结构**：前端（分析）+ 后端（综合）\\n\\n### 文法与语言\\n**形式语言基础**：\\n- 字母表、字符串、语言\\n- 文法G = (Vₜ, Vₙ, P, S)\\n\\n**文法分类（乔姆斯基体系）**：\\n- 0型：无限制文法\\n- 1型：上下文有关文法\\n- 2型：上下文无关文法\\n- 3型：正则文法（右线性/左线性）\\n\\n**推导与归约、语法树、二义性**\\n\\n### 词法分析\\n**任务**：识别单词，输出属性字\\n\\n**正规式与正规集**：\\n- 基本运算：或(|)、连接、闭包(*)\\n\\n**有限自动机**：\\n- DFA：确定性有限自动机\\n- NFA：非确定性有限自动机\\n- NFA确定化（子集法）\\n- DFA最小化（划分法）\\n\\n**词法分析器生成**：LEX/FLEX工具\\n\\n### 语法分析\\n**自顶向下分析**：\\n- 递归下降分析\\n- LL(1)分析：\\n  - 消除左递归\\n  - 提取公共左因子\\n  - FIRST集、FOLLOW集\\n  - 构造预测分析表\\n\\n**自底向上分析**：\\n- 算符优先分析\\n- LR分析：\\n  - LR(0)、SLR(1)、LR(1)、LALR(1)\\n  - 构造识别活前缀的DFA\\n  - 构造LR分析表\\n  - 移进-归约冲突、归约-归约冲突\\n\\n**YACC/Bison工具**\\n\\n### 语法制导翻译与中间代码\\n**属性文法**：\\n- 综合属性：自底向上传递\\n- 继承属性：自顶向下传递\\n\\n**中间代码形式**：\\n- 后缀式（逆波兰式）\\n- 三元式、四元式\\n- 树形表示\\n\\n**常见语句翻译**：\\n- 算术表达式\\n- 布尔表达式\\n- 控制语句（if-else、while）\\n- 数组元素引用\\n- 过程调用\\n\\n### 代码优化与目标代码生成\\n**优化分类**：\\n- 机器无关优化 vs 机器相关优化\\n- 局部优化 vs 循环优化 vs 全局优化\\n\\n**常用优化技术**：\\n- 删除公共子表达式\\n- 复写传播\\n- 删除无用代码\\n- 代码外提\\n- 强度削弱\\n- 删除归纳变量\\n\\n**数据流分析**：\\n- 到达-定值分析\\n- 活跃变量分析\\n- 可用表达式分析\\n\\n**目标代码生成**：\\n- 寄存器分配\\n- 指令选择\\n- 简单的代码生成算法\"},{\"id\":\"cs-7\",\"title\":\"软件工程\",\"difficulty\":3,\"content\":\"$10\"}]},\"moduleId\":\"cs\"}]\n"])</script><script>self.__next_f.push([1,"9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/bd395c328f5600f0.js\"],\"IconMark\"]\n7:null\nb:[[\"$\",\"title\",\"0\",{\"children\":\"欧拉登基之路 - 理科学习交流平台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"针对高中及大学的理科教学沟通互动平台，包含数学、物理、计算机等科目的知识库和每日一题挑战\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"数学,物理,计算机,学习,教育,每日一题,论坛\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\
