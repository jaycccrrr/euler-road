式\\n- 范德蒙德行列式\\n- 分块行列式\\n\\n### 克拉默法则\\n对于n元线性方程组Ax=b，当|A|≠0时：\\nxᵢ = Dᵢ/D (i=1,2,...,n)\\n其中Dᵢ是将D的第i列换为b所得的行列式\"},{\"id\":\"la-2\",\"title\":\"矩阵及其运算\",\"difficulty\":3,\"content\":\"## 矩阵及其运算\\n\\n### 矩阵的基本概念\\n**定义**：m×n个数排成的m行n列的数表\\n\\n**特殊矩阵**：\\n- 零矩阵、单位矩阵E、对角矩阵\\n- 数量矩阵、三角矩阵\\n- 对称矩阵：Aᵀ = A\\n- 反对称矩阵：Aᵀ = -A\\n- 正交矩阵：AᵀA = AAᵀ = E\\n\\n### 矩阵运算\\n**加法**：对应元素相加（同型矩阵）\\n\\n**数乘**：kA = (kaᵢⱼ)\\n\\n**乘法**：\\n- 条件：AₘₓₙBₙₓₚ = Cₘₓₚ\\n- 元素：cᵢⱼ = Σₖ₌₁ⁿ aᵢₖbₖⱼ\\n- 性质：一般不满足交换律，满足结合律、分配律\\n\\n**转置**：\\n- (Aᵀ)ᵀ = A\\n- (A+B)ᵀ = Aᵀ + Bᵀ\\n- (kA)ᵀ = kAᵀ\\n- (AB)ᵀ = BᵀAᵀ\\n\\n### 逆矩阵\\n**定义**：若AB=BA=E，则B=A⁻¹\\n\\n**存在的充要条件**：|A|≠0\\n\\n**求逆方法**：\\n- 伴随矩阵法：A⁻¹ = A*/|A|\\n- 初等变换法：[A|E] → [E|A⁻¹]\\n\\n**性质**：\\n- (A⁻¹)⁻¹ = A\\n- (kA)⁻¹ = (1/k)A⁻¹ (k≠0)\\n- (AB)⁻¹ = B⁻¹A⁻¹\\n- (Aᵀ)⁻¹ = (A⁻¹)ᵀ\\n\\n### 矩阵的秩\\n**定义**：矩阵中非零子式的最高阶数\\n\\n**求秩方法**：初等行变换化为行阶梯形，非零行数即为秩\\n\\n**性质**：\\n- r(A) = r(Aᵀ)\\n- r(kA) = r(A) (k≠0)\\n- r(A+B) ≤ r(A) + r(B)\\n- r(AB) ≤ min{r(A), r(B)}\"},{\"id\":\"la-3\",\"title\":\"向量组的线性相关性\",\"difficulty\":3,\"content\":\"## 向量组的线性相关性\\n\\n### n维向量\\n**定义**：n个有序数(a₁,a₂,...,aₙ)组成的数组\\n\\n**运算**：加法、数乘（同矩阵运算）\\n\\n### 线性组合与线性表示\\n**线性组合**：k₁α₁ + k₂α₂ + ... + kₘαₘ\\n\\n**线性表示**：β可由α₁,α₂,...,αₘ线性表示\\n⇔ 存在k₁,k₂,...,kₘ使得β = k₁α₁ + k₂α₂ + ... + kₘαₘ\\n⇔ r(α₁,...,αₘ) = r(α₁,...,αₘ,β)\\n\\n### 线性相关与线性无关\\n**定义**：\\n- 线性相关：存在不全为零的k₁,k₂,...,kₘ使k₁α₁+...+kₘαₘ=0\\n- 线性无关：仅当k₁=...=kₘ=0时上式成立\\n\\n**判定方法**：\\n- 向量组α₁,α₂,...,αₘ线性相关 ⇔ r(α₁,...,αₘ) \u003c m\\n- 向量组α₁,α₂,...,αₘ线性无关 ⇔ r(α₁,...,αₘ) = m\\n\\n**重要结论**：\\n- n+1个n维向量必线性相关\\n- 部分相关则整体相关，整体无关则部分无关\\n- 线性无关组添加分量仍无关，线性相关组减少分量仍相关\\n\\n### 向量组的秩\\n**极大线性无关组**：\\n- 部分组线性无关\\n- 原向量组中任一向量可由它线性表示\\n\\n**向量组的秩**：极大线性无关组所含向量的个数\\n\\n**矩阵的行秩=列秩=矩阵的秩**\\n\\n### 向量空间\\n**基**：向量空间的极大线性无关组\\n**维数**：基所含向量的个数\\n**坐标**：向量在基下的表示系数\"},{\"id\":\"la-4\",\"title\":\"线性方程组\",\"difficulty\":3,\"content\":\"## 线性方程组\\n\\n### 线性方程组的表示\\n**一般形式**：\\n- a₁₁x₁ + ... + a₁ₙxₙ = b₁\\n- ...\\n- aₘ₁x₁ + ... + aₘₙxₙ = bₘ\\n\\n**矩阵形式**：Ax = b\\n- A：系数矩阵\\n- [A|b]：增广矩阵\\n\\n**向量形式**：x₁α₁ + x₂α₂ + ... + xₙαₙ = b\\n\\n### 解的判定\\n**齐次方程组Ax=0**：\\n- 有非零解 ⇔ r(A) \u003c n\\n- 只有零解 ⇔ r(A) = n\\n\\n**非齐次方程组Ax=b**：\\n- 有解 ⇔ r(A) = r([A|b])\\n- 唯一解 ⇔ r(A) = r([A|b]) = n\\n- 无穷多解 ⇔ r(A) = r([A|b]) \u003c n\\n- 无解 ⇔ r(A) ≠ r([A|b])\\n\\n### 解的结构\\n**齐次方程组**：\\n- 基础解系：解空间的极大线性无关组\\n- 基础解系含n-r(A)个解向量\\n- 通解：X = k₁ξ₁ + k₂ξ₂ + ... + kₙ₋ᵣξₙ₋ᵣ\\n\\n**非齐次方程组**：\\n- 通解 = 特解 + 对应齐次的通解\\n- X = η* + k₁ξ₁ + ... + kₙ₋ᵣξₙ₋ᵣ\\n\\n### 求解方法\\n**高斯消元法**：\\n- 对增广矩阵进行初等行变换\\n- 化为行阶梯形（判断解的情况）\\n- 化为行最简形（求通解）\\n\\n**克拉默法则**：|A|≠0时，xᵢ = Dᵢ/D\"},{\"id\":\"la-5\",\"title\":\"特征值与特征向量\",\"difficulty\":4,\"content\":\"## 特征值与特征向量\\n\\n### 定义\\n对于n阶方阵A，若存在数λ和非零向量ξ使得：\\nAξ = λξ\\n\\n则λ称为A的特征值，ξ称为A的属于λ的特征向量。\\n\\n### 特征值与特征向量的求法\\n1. **求特征多项式**：|λE - A| = 0\\n2. **求特征值**：解特征方程得λ₁,λ₂,...,λₙ\\n3. **求特征向量**：对每个λᵢ，解(λᵢE-A)x=0得基础解系\\n\\n### 特征值的性质\\n- λ₁+λ₂+...+λₙ = tr(A) = a₁₁+a₂₂+...+aₙₙ\\n- λ₁λ₂...λₙ = |A|\\n- 若λ是A的特征值，则：\\n  - λᵏ是Aᵏ的特征值\\n  - f(λ)是f(A)的特征值\\n  - 1/λ是A⁻¹的特征值（A可逆时）\\n\\n### 特征向量的性质\\n- 属于不同特征值的特征向量线性无关\\n- 属于同一特征值的特征向量的非零线性组合仍是该特征值的特征向量\\n\\n### 相似矩阵\\n**定义**：若P⁻¹AP = B，则A与B相似\\n\\n**性质**：\\n- 相似矩阵有相同的特征多项式、特征值\\n- 相似矩阵有相同的行列式、迹、秩\\n- 相似矩阵的幂、逆也相似\\n\\n### 矩阵的对角化\\n**可对角化条件**：\\n- n阶矩阵A可对角化 ⇔ A有n个线性无关的特征向量\\n- A有n个不同特征值 ⇒ A可对角化\\n\\n**对角化方法**：\\n- 求特征值λ₁,λ₂,...,λₙ\\n- 求对应的线性无关特征向量ξ₁,ξ₂,...,ξₙ\\n- 令P = [ξ₁,ξ₂,...,ξₙ]，则P⁻¹AP = diag(λ₁,λ₂,...,λₙ)\\n\\n### 实对称矩阵\\n**性质**：\\n- 特征值都是实数\\n- 不同特征值对应的特征向量正交\\n- 必可正交相似对角化\\n\\n**正交对角化步骤**：\\n1. 求特征值\\n2. 求特征向量并正交化、单位化\\n3. 构造正交矩阵Q，使QᵀAQ = Λ\"},{\"id\":\"la-6\",\"title\":\"二次型\",\"difficulty\":4,\"content\":\"## 二次型\\n\\n### 二次型的概念\\n**定义**：n元二次齐次多项式\\nf(x₁,...,xₙ) = Σaᵢᵢxᵢ² + 2Σaᵢⱼxᵢxⱼ (i\u003cj)\\n\\n**矩阵表示**：f = xᵀAx\\n- A是对称矩阵，称A为二次型的矩阵\\n- r(A)为二次型的秩\\n\\n### 标准形与规范形\\n**标准形**：只含平方项的二次型\\nf = d₁y₁² + d₂y₂² + ... + dₙyₙ²\\n\\n**规范形**：系数为±1或0的标准形\\nf = y₁² + ... + yₚ² - yₚ₊₁² - ... - yᵣ²\\n\\n**惯性定理**：规范形中正项个数p（正惯性指数）、负项个数q（负惯性指数）是唯一确定的。\\n\\n### 化二次型为标准形\\n**正交变换法**：\\n- 对实对称矩阵A，求正交矩阵Q使QᵀAQ = Λ\\n- 令x = Qy，则f = yᵀΛy = λ₁y₁² + ... + λₙyₙ²\\n\\n**配方法**：\\n- 按变量顺序逐步配方\\n- 若平方项不全，先做可逆线性变换产生平方项\\n\\n**初等变换法**：\\n- 对矩阵[A|E]进行合同变换\\n\\n### 正定二次型\\n**定义**：∀x≠0，f = xᵀAx \u003e 0\\n\\n**等价条件**：\\n- 正惯性指数 = n\\n- A的特征值全大于0\\n- A的各阶顺序主子式全大于0\\n- 存在可逆矩阵C使A = CᵀC\\n\\n**半正定**：∀x，f ≥ 0\\n**负定**：∀x≠0，f \u003c 0\"},{\"id\":\"la-7\",\"title\":\"线性空间与线性变换\",\"difficulty\":5,\"content\":\"## 线性空间与线性变换\\n\\n### 线性空间\\n**定义**：非空集合V，数域P，定义加法和数乘运算，满足8条运算规律。\\n\\n**例子**：\\n- Pⁿ：n维向量空间\\n- P[x]：多项式空间\\n- P[x]ₙ：次数小于n的多项式加零多项式\\n- Mₘₓₙ(P)：m×n矩阵空间\\n\\n### 基、维数与坐标\\n**基**：线性空间的极大线性无关组\\n**维数**：基中向量的个数，记为dim(V)\\n\\n**坐标**：\\n- 设ε₁,ε₂,...,εₙ是V的一组基\\n- α = x₁ε₁ + x₂ε₂ + ... + xₙεₙ\\n- (x₁,x₂,...,xₙ)ᵀ称为α在该基下的坐标\\n\\n**基变换与坐标变换**：\\n- 设(η₁,...,ηₙ) = (ε₁,...,εₙ)P，P为过渡矩阵\\n- 坐标变换：x = Py 或 y = P⁻¹x\\n\\n### 子空间\\n**定义**：V的非空子集W，对V的运算也构成线性空间\\n\\n**常见子空间**：\\n- 生成子空间：L(α₁,α₂,...,αₘ)\\n- 核空间：ker(A) = {x | Ax = 0}\\n- 像空间：Im(A) = {Ax | x∈V}\\n\\n**维数公式**：\\ndim(V₁+V₂) = dim(V₁) + dim(V₂) - dim(V₁∩V₂)\\n\\n### 线性变换\\n**定义**：V到自身的映射T，满足：\\n- T(α+β) = T(α) + T(β)\\n- T(kα) = kT(α)\\n\\n**例子**：\\n- 恒等变换、零变换\\n- 数乘变换\\n- 微分变换、积分变换\\n\\n### 线性变换的矩阵\\n**矩阵表示**：\\n- 设ε₁,...,εₙ是V的一组基\\n- T(ε₁,...,εₙ) = (ε₁,...,εₙ)A\\n- A称为T在该基下的矩阵\\n\\n**同一线性变换在不同基下的矩阵相似**\\n\\n### 特征值与特征向量\\n**定义**：T(ξ) = λξ，ξ≠0\\n\\n**性质**：\\n- 不同特征值的特征向量线性无关\\n- 特征子空间：Vλ = {ξ | T(ξ) = λξ}\\n\\n### 不变子空间\\n**定义**：W是V的子空间，若T(W)⊆W，则W是T的不变子空间\\n\\n**例子**：特征子空间是不变子空间\"}]},\"moduleId\":\"linear-algebra\"}]\n"])</script><script>self.__next_f.push([1,"9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"e:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/bd395c328f5600f0.js\"],\"IconMark\"]\n7:null\nb:[[\"$\",\"title\",\"0\",{\"children\":\"欧拉登基之路 - 理科学习交流平台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"针对高中及大学的理科教学沟通互动平台，包含数学、物理、计算机等科目的知识库和每日一题挑战\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"数学,物理,计算机,学习,教育,每日一题,论坛\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Le\",\"4\",{}]]\n"])</script></body></html>
