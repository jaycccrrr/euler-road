a4061a4edf27.js\",\"/_next/static/chunks/6454366117e44fa3.js\",\"/_next/static/chunks/bf55b9c8f6d077d0.js\",\"/_next/static/chunks/642ab56133dc442d.js\",\"/_next/static/chunks/7fcec477619ebfc7.js\",\"/_next/static/chunks/6c68d6ebf8969394.js\",\"/_next/static/chunks/34dcd0e51e711b6d.js\"],\"default\"]\ne:T810,## 多元函数微分学\n\n### 一、多元函数概念\n**二元函数**：z = f(x, y)，定义域为平面点集\n- **邻域**：以P₀为中心，δ为半径的圆内所有点\n- **区域**：开区域、闭区域、有界区域、无界区域\n\n**极限与连续**：\n- 二重极限：lim₍(x,y)→(x₀,y₀)₎ f(x,y) = A\n- 连续性：lim₍(x,y)→(x₀,y₀)₎ f(x,y) = f(x₀,y₀)\n\n### 二、偏导数\n**定义**：\n- ∂z/∂x = lim(Δx→0) [f(x+Δx,y) - f(x,y)]/Δx\n- ∂z/∂y = lim(Δy→0) [f(x,y+Δy) - f(x,y)]/Δy\n\n**几何意义**：偏导数是函数沿坐标轴方向的变化率\n\n**高阶偏导数**：\n- ∂²z/∂x², ∂²z/∂y², ∂²z/∂x∂y, ∂²z/∂y∂x\n- **重要定理**：当二阶混合偏导数连续时，∂²z/∂x∂y = ∂²z/∂y∂x\n\n### 三、全微分\n**定义**：dz = (∂z/∂x)dx + (∂z/∂y)dy\n\n**可微条件**：\n- 必要条件：偏导数存在\n- 充分条件：偏导数连续\n\n### 四、复合函数微分法（链式法则）\n**情形1**：z = f(u,v), u = u(x,y), v = v(x,y)\n- ∂z/∂x = (∂z/∂u)(∂u/∂x) + (∂z/∂v)(∂v/∂x)\n- ∂z/∂y = (∂z/∂u)(∂u/∂y) + (∂z/∂v)(∂v/∂y)\n\n**情形2**：z = f(u,v), u = u(x), v = v(x)\n- dz/dx = (∂z/∂u)(du/dx) + (∂z/∂v)(dv/dx)\n\n### 五、隐函数求导\n**一元隐函数**：F(x,y) = 0\n- dy/dx = -Fₓ/Fᵧ\n\n**二元隐函数**：F(x,y,z) = 0\n- ∂z/∂x = -Fₓ/Fz, ∂z/∂y = -Fᵧ/Fz\n\n### 六、方向导数与梯度\n**方向导数**：\n- ∂f/∂l = (∂f/∂x)cosα + (∂f/∂y)cosβ + (∂f/∂z)cosγ\n- 表示函数沿方向 **l** 的变化率\n\n**梯度**：\n- grad f = (∂f/∂x, ∂f/∂y, ∂f/∂z)\n- 方向：函数增长最快的方向\n- 模：最大方向导数的值\n\n### 七、多元函数极值\n**无条件极值**：\n1. 求驻点：fₓ = 0, fᵧ = 0\n2. 判别：AC - B² 的符号（A=fₓₓ, B=fₓᵧ, C=fᵧᵧ）\n\n**条件极值（拉格朗日乘数法）**：\n求 z = f(x,y) 在 φ(x,y) = 0 下的极值\n1. 构造 F(x,y,λ) = f(x,y) + λφ(x,y)\n2. 求偏导并令其为零\n3. 解方程组得可能极值点f:T7d3,## 重积分\n\n### 一、二重积分\n**定义**：∬ᴅ f(x,y)dσ = lim(λ→0) Σf(ξᵢ,ηᵢ)Δσᵢ\n\n**几何意义**：曲顶柱体的体积（f(x,y)≥0时）\n\n**基本性质**：\n1. **线性性质**：∬ᴅ [αf(x,y) + βg(x,y)]dσ = α∬ᴅ f(x,y)dσ + β∬ᴅ g(x,y)dσ\n2. **区域可加性**：D = D₁ ∪ D₂，则 ∬ᴅ f(x,y)dσ = ∬ᴅ₁ f(x,y)dσ + ∬ᴅ₂ f(x,y)dσ\n3. **比较定理**：f(x,y) ≤ g(x,y) ⇒ ∬ᴅ f(x,y)dσ ≤ ∬ᴅ g(x,y)dσ\n4. **积分中值定理**：存在(ξ,η)∈D，使 ∬ᴅ f(x,y)dσ = f(ξ,η)·S(D)\n\n### 二、二重积分计算方法\n**1. 直角坐标系**：\n\n**X型区域**（a ≤ x ≤ b, φ₁(x) ≤ y ≤ φ₂(x)）：\n∬ᴅ f(x,y)dσ = ∫ₐᵇdx ∫ᵩ₁₍ₓ₎ᵩ₂₍ₓ₎ f(x,y)dy\n\n**Y型区域**（c ≤ y ≤ d, ψ₁(y) ≤ x ≤ ψ₂(y)）：\n∬ᴅ f(x,y)dσ = ∫ᶜᵈdy ∫ᵩ₁₍ᵧ₎ᵩ₂₍ᵧ₎ f(x,y)dx\n\n**2. 极坐标系**：\n- 变换：x = rcosθ, y = rsinθ, dσ = r dr dθ\n- ∬ᴅ f(x,y)dσ = ∬ᴅ' f(rcosθ,rsinθ) r dr dθ\n\n**何时用极坐标？**\n- 积分区域是圆域、圆环域、扇形\n- 被积函数含x²+y²、y/x等形式\n\n### 三、三重积分\n**定义**：∭Ω f(x,y,z)dV\n\n**计算方法**：\n1. **直角坐标系**：\n   - **先一后二（穿针法）**：先对z积分，再对x,y积分\n   - **先二后一（截面法）**：先对x,y积分，再对z积分\n\n2. **柱面坐标系**：\n   - x = rcosθ, y = rsinθ, z = z\n   - dV = r dr dθ dz\n\n3. **球面坐标系**：\n   - x = rsinφcosθ, y = rsinφsinθ, z = rcosφ\n   - dV = r²sinφ dr dφ dθ\n\n**何时用柱坐标？** 投影区域是圆域，或被积函数含x²+y²\n**何时用球坐标？** 区域是"])</script><script>self.__next_f.push([1,"球域或球壳，或被积函数含x²+y²+z²\n\n### 四、重积分的应用\n**几何应用**：\n- 平面图形面积：S = ∬ᴅ dσ\n- 曲面面积：S = ∬ᴅ √(1+zₓ²+zᵧ²) dσ\n- 立体体积：V = ∭Ω dV\n\n**物理应用**：\n- 质量：M = ∭Ω ρ(x,y,z)dV\n- 质心坐标\n- 转动惯量\n- 引力10:T881,## 曲线积分与曲面积分\n\n### 一、第一类曲线积分（对弧长）\n**定义**：∫ₗ f(x,y)ds，其中ds为弧长微元\n\n**物理意义**：曲线形构件的质量（f为线密度）\n\n**计算方法**：\n1. **参数方程** L: x=φ(t), y=ψ(t) (α≤t≤β)\n   - ∫ₗ f(x,y)ds = ∫ₐᵝ f[φ(t),ψ(t)]√[φ'(t)²+ψ'(t)²] dt\n\n2. **直角坐标** y=y(x) (a≤x≤b)\n   - ∫ₗ f(x,y)ds = ∫ₐᵇ f[x,y(x)]√[1+y'(x)²] dx\n\n3. **极坐标** r=r(θ) (α≤θ≤β)\n   - ∫ₗ f(x,y)ds = ∫ₐᵝ f(rcosθ,rsinθ)√[r²+r'(θ)²] dθ\n\n### 二、第二类曲线积分（对坐标）\n**定义**：∫ₗ P(x,y)dx + Q(x,y)dy\n\n**物理意义**：变力沿曲线做功\n\n**计算方法**：\n- 参数方程：∫ₐᵝ [P(φ(t),ψ(t))φ'(t) + Q(φ(t),ψ(t))ψ'(t)]dt\n\n**格林公式**：\n- 条件：L是正向闭曲线，P、Q在D上有连续偏导数\n- 公式：∮ₗ Pdx + Qdy = ∬ᴅ (∂Q/∂x - ∂P/∂y) dxdy\n\n**与路径无关的等价条件**（单连通区域）：\n1. ∂Q/∂x = ∂P/∂y\n2. ∮ₗ Pdx + Qdy = 0（L为任意闭曲线）\n3. 存在u(x,y)使得du = Pdx + Qdy（即P=∂u/∂x, Q=∂u/∂y）\n\n**求原函数u(x,y)**：\n- u(x,y) = ∫₍ₓ₀,ᵧ₀₎₍ₓ,ᵧ₎ Pdx + Qdy\n- 或 u(x,y) = ∫ₓ₀ˣ P(x,y₀)dx + ∫ᵧ₀ᵧ Q(x,y)dy\n\n### 三、第一类曲面积分（对面积）\n**定义**：∬Σ f(x,y,z)dS\n\n**计算方法**：\n- 设Σ: z=z(x,y), (x,y)∈D\n- dS = √[1+zₓ²+zᵧ²] dxdy\n- ∬Σ f(x,y,z)dS = ∬ᴅ f[x,y,z(x,y)]√[1+zₓ²+zᵧ²] dxdy\n\n### 四、第二类曲面积分（对坐标）\n**定义**：∬Σ Pdydz + Qdzdx + Rdxdy\n\n**注意**：积分与曲面的侧（方向）有关\n\n**计算方法**：\n- ∬Σ R(x,y,z)dxdy = ±∬ᴅ R[x,y,z(x,y)]dxdy（上侧取+，下侧取-）\n\n### 五、高斯公式与斯托克斯公式\n**高斯公式（散度定理）**：\n- 条件：Σ是闭曲面外侧，P、Q、R在Ω上有连续偏导数\n- ∯Σ Pdydz + Qdzdx + Rdxdy = ∭Ω (∂P/∂x + ∂Q/∂y + ∂R/∂z) dV\n\n**斯托克斯公式**：\n- 条件：Γ是分段光滑闭曲线，Σ是以Γ为边界的曲面\n- ∮Γ Pdx + Qdy + Rdz = ∬Σ |(dydz, dzdx, dxdy), (∂/∂x, ∂/∂y, ∂/∂z), (P, Q, R)|"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Ld\",null,{\"module\":{\"id\":\"advanced-math\",\"name\":\"高等数学\",\"category\":\"math\",\"icon\":\"🔬\",\"color\":\"from-indigo-400 to-indigo-600\",\"description\":\"大学高等数学，包括微积分、多元函数、重积分、曲线曲面积分\",\"topics\":[{\"id\":\"am-1\",\"title\":\"向量与空间解析几何\",\"difficulty\":3,\"content\":\"## 向量与空间解析几何\\n\\n### 一、方向角与方向余弦\\n\\n**方向角的概念**：\\n在空间中，如何精确描述一个向量的\\\"方向\\\"？方向角和方向余弦就是解决这个问题的工具。\\n\\n设向量 **a** = (a₁, a₂, a₃)，它与 x 轴、y 轴、z 轴正方向的夹角分别记为 α、β、γ，称为向量的**方向角**。\\n- α = ∠(**a**, **i**)， β = ∠(**a**, **j**)， γ = ∠(**a**, **k**)\\n\\n**方向余弦**：\\ncos α = a₁/|**a**| = a₁/√(a₁² + a₂² + a₃²)\\ncos β = a₂/|**a**| = a₂/√(a₁² + a₂² + a₃²)\\ncos γ = a₃/|**a**| = a₃/√(a₁² + a₂² + a₃²)\\n\\n**方向余弦基本恒等式**：\\ncos²α + cos²β + cos²γ = 1\\n\\n### 二、向量的运算\\n\\n**数量积（点积）**：\\n**a**·**b** = |**a**||**b**|cosθ = a₁b₁ + a₂b₂ + a₃b₃\\n\\n**向量积（叉积）**：\\n|**a**×**b**| = |**a**||**b**|sinθ，方向符合右手法则\\n\\n**混合积**：\\n(**a**×**b**)·**c** = 三向量构成的平行六面体体积\\n\\n### 三、平面与直线\\n\\n**平面方程**：\\n- 点法式：A(x-x₀) + B(y-y₀) + C(z-z₀) = 0\\n- 一般式：Ax + By + Cz + D = 0\\n- 截距式：x/a + y/b + z/c = 1\\n\\n**直线方程**：\\n- 对称式：(x-x₀)/m = (y-y₀)/n = (z-z₀)/p\\n- 参数式：x = x₀ + mt, y = y₀ + nt, z = z₀ + pt\\n\\n### 四、常见曲面\\n- 球面：(x-a)² + (y-b)² + (z-c)² = R²\\n- 柱面、旋转曲面、二次曲面（椭球面、抛物面、双曲面）\"},{\"id\":\"am-2\",\"title\":\"多元函数微分学\",\"difficulty\":4,\"content\":\"$e\"},{\"id\":\"am-3\",\"title\":\"重积分\",\"difficulty\":4,\"content\":\"$f\"},{\"id\":\"am-4\",\"title\":\"曲线积分与曲面积分\",\"difficulty\":5,\"content\":\"$10\"},{\"id\":\"am-5\",\"title\":\"无穷级数\",\"difficulty\":4,\"content\":\"## 无穷级数\\n\\n### 常数项级数\\n**基本概念**：\\n- 级数：Σₙ₌₁^∞ uₙ = u₁ + u₂ + ... + uₙ + ...\\n- 部分和：Sₙ = u₁ + u₂ + ... + uₙ\\n- 收敛：lim(n→∞) Sₙ = S 存在\\n\\n**基本性质**：\\n- 线性性质\\n- 改变有限项不影响敛散性\\n- 加括号性质\\n- 收敛的必要条件：lim(n→∞) uₙ = 0\\n\\n**判别法**：\\n1. **正项级数**：\\n   - 比较判别法\\n   - 比值判别法（达朗贝尔）\\n   - 根值判别法（柯西）\\n   - 积分判别法\\n\\n2. **交错级数**：\\n   - 莱布尼茨判别法\\n\\n3. **任意项级数**：\\n   - 绝对收敛与条件收敛\\n\\n### 幂级数\\n**形式**：Σₙ₌₀^∞ aₙxⁿ\\n\\n**收敛半径**：\\n- R = lim |aₙ/aₙ₊₁| 或 R = 1/lim ⁿ√|aₙ|\\n\\n**性质**：\\n- 在收敛区间内可逐项求导、逐项积分\\n- 和函数S(x)在收敛区间内连续\\n\\n**泰勒级数**：\\n- f(x) = Σₙ₌₀^∞ [f⁽ⁿ⁾(x₀)/n!](x-x₀)ⁿ\\n- 展开条件：余项Rₙ(x)→0\\n\\n**常见展开式**：\\n- eˣ = Σ xⁿ/n!\\n- sin x = Σ (-1)ⁿx²ⁿ⁺¹/(2n+1)!\\n- cos x = Σ (-1)ⁿx²ⁿ/(2n)!\\n- ln(1+x) = Σ (-1)ⁿ⁻¹xⁿ/n\"},{\"id\":\"am-6\",\"title\":\"常微分方程\",\"difficulty\":4,\"content\":\"## 常微分方程\\n\\n### 基本概念\\n- **微分方程**：含有未知函数及其导数的方程\\n- **阶**：方程中出现的最高阶导数的阶数\\n- **解**：通解（含任意常数）、特解、初值问题\\n\\n### 一阶微分方程\\n**可分离变量**：\\n- dy/dx = f(x)g(y) → ∫dy/g(y) = ∫f(x)dx\\n\\n**齐次方程**：\\n- dy/dx = φ(y/x)，令u = y/x\\n\\n**一阶线性方程**：\\n- dy/dx + P(x)y = Q(x)\\n- 通解：y = e^(-∫Pdx)[∫Qe^(∫Pdx)dx + C]\\n\\n**伯努利方程**：\\n- dy/dx + P(x)y = Q(x)yⁿ (n≠0,1)\\n- 令z = y^(1-n) 化为线性方程\\n\\n### 可降阶的高阶方程\\n1. **y⁽ⁿ⁾ = f(x)**：直接积分n次\\n2. **y'' = f(x,y')**：令p = y'\\n3. **y'' = f(y,y')**：令p = y'，y'' = p(dp/dy)\\n\\n### 高阶线性微分方程\\n**二阶常系数齐次线性方程**：\\n- y'' + py' + qy = 0\\n- 特征方程：r² + pr + q = 0\\n  - 两不等实根r₁≠r₂：y = C₁e^(r₁x) + C₂e^(r₂x)\\n  - 相等实根r₁=r₂：y = (C₁+C₂x)e^(rx)\\n  - 共轭复根α±βi：y = e^(αx)(C₁cosβx + C₂sinβx)\\n\\n**二阶常系数非齐次线性方程**：\\n- y'' + py' + qy = f(x)\\n- 通解 = 齐次通解 + 特解\\n- 特解求法：待定系数法、常数变易法\"},{\"id\":\"am-7\",\"title\":\"傅里叶级数\",\"difficulty\":4,\"content\":\"## 傅里叶级数\\n\\n### 三角函数系的正交性\\n在[-π,π]上，函数系{1, cosx, sinx, cos2x, sin2x, ...}具有正交性：\\n- ∫₋ₚᵢₚᵢ cosnx dx = 0 (n≠0)\\n- ∫₋ₚᵢₚᵢ sinnx dx = 0\\n- ∫₋ₚᵢₚᵢ cosmx cosnx dx = 0 (m≠n)\\n- ∫₋ₚᵢₚᵢ sinmx sinnx dx = 0 (m≠n)\\n- ∫₋ₚᵢₚᵢ cosmx sinnx dx = 0\\n\\n### 傅里叶级数展开\\n**周期为2π的函数**：\\n- f(x) = a₀/2 + Σₙ₌₁^∞ (aₙcosnx + bₙsinnx)\\n- aₙ = (1/π)∫₋ₚᵢₚᵢ f(x)cosnx dx (n=0,1,2,...)\\n- bₙ = (1/π)∫₋ₚᵢₚᵢ f(x)sinnx dx (n=1,2,3,...)\\n\\n**周期为2l的函数**：\\n- f(x) = a₀/2 + Σₙ₌₁^∞ [aₙcos(nπx/l) + bₙsin(nπx/l)]\\n- aₙ = (1/l)∫₋ₗₗ f(x)cos(nπx/l) dx\\n- bₙ = (1/l)∫₋ₗₗ f(x)sin(nπx/l) dx\\n\\n### 狄利克雷收敛定理\\n若f(x)在一个周期内：\\n1. 连续或只有有限个第一类间断点\\n2. 至多只有有限个极值点\\n\\n则傅里叶级数收敛，且：\\n- 在连续点：收敛于f(x)\\n- 在间断点：收敛于[f(x-0)+f(x+0)]/2\\n\\n### 正弦级数与余弦级数\\n**奇函数展开（正弦级数）**：\\n- aₙ = 0, bₙ = (2/π)∫₀^π f(x)sinnx dx\\n\\n**偶函数展开（余弦级数）**：\\n- aₙ = (2/π)∫₀^π f(x)cosnx dx, bₙ = 0\"}]},\"moduleId\":\"advanced-math\"}]\n"])</script><script>self.__next_f.push([1,"9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/bd395c328f5600f0.js\"],\"IconMark\"]\n7:null\nb:[[\"$\",\"title\",\"0\",{\"children\":\"欧拉登基之路 - 理科学习交流平台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"针对高中及大学的理科教学沟通互动平台，包含数学、物理、计算机等科目的知识库和每日一题挑战\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"数学,物理,计算机,学习,教育,每日一题,论坛\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]]\n"])</script></body></html>
