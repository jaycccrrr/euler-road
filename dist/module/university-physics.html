iv\",null,{\"hidden\":true,\"children\":[\"$\",\"$La\",null,{\"children\":[\"$\",\"$6\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Lb\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[31573,[\"/_next/static/chunks/93b8a4061a4edf27.js\",\"/_next/static/chunks/6454366117e44fa3.js\",\"/_next/static/chunks/bf55b9c8f6d077d0.js\",\"/_next/static/chunks/642ab56133dc442d.js\",\"/_next/static/chunks/7fcec477619ebfc7.js\",\"/_next/static/chunks/6c68d6ebf8969394.js\",\"/_next/static/chunks/34dcd0e51e711b6d.js\"],\"default\"]\ne:T866,## 热力学基础\n\n### 气体状态参量\n**压强p**：气体分子对器壁碰撞的宏观表现\n- 单位：Pa（帕斯卡）\n- 1 atm = 1.013×10⁵ Pa = 760 mmHg\n\n**体积V**：气体分子能达到的空间\n- 单位：m³\n\n**温度T**：\n- 热力学温度（开尔文温度）：单位K\n- 摄氏温度t：单位°C\n- 关系：T = t + 273.15\n\n### 理想气体状态方程\n**形式**：\n- pV = (m/M)RT = νRT\n- pV = NkT\n\n**常量**：\n- R = 8.31 J/(mol·K)（普适气体常量）\n- k = 1.38×10⁻²³ J/K（玻尔兹曼常量）\n- Nᴀ = 6.02×10²³ mol⁻¹（阿伏伽德罗常数）\n\n### 热力学第一定律\n**内容**：系统从外界吸收的热量，一部分使系统内能增加，一部分使系统对外做功。\n\n**表达式**：Q = ΔE + W 或 dQ = dE + dW\n\n**符号规定**：\n- Q \u003e 0：吸热；Q \u003c 0：放热\n- ΔE \u003e 0：内能增加；ΔE \u003c 0：内能减少\n- W \u003e 0：对外做功；W \u003c 0：外界对系统做功\n\n### 理想气体的等值过程\n**等体过程**（V=常量）：\n- W = 0\n- Q = ΔE = νCvΔT\n- Cv = (i/2)R（定容摩尔热容）\n\n**等压过程**（p=常量）：\n- W = pΔV = νRΔT\n- Q = νCpΔT\n- Cp = Cv + R = [(i+2)/2]R（定压摩尔热容）\n- γ = Cp/Cv（比热容比）\n\n**等温过程**（T=常量）：\n- ΔE = 0\n- Q = W = νRTln(V₂/V₁) = νRTln(p₁/p₂)\n\n**绝热过程**（Q=0）：\n- ΔE = -W\n- pV^γ = 常量\n- TV^(γ-1) = 常量\n\n### 循环过程与卡诺循环\n**循环过程**：\n- 正循环（热机）：从高温热源吸热，向低温热源放热，对外做功\n- 效率：η = W/Q₁ = 1 - Q₂/Q₁\n\n**卡诺循环**：由两个等温过程和两个绝热过程组成\n- 卡诺热机效率：η = 1 - T₂/T₁\n- 卡诺定理：所有工作于相同高温热源和低温热源之间的热机，以可逆热机效率最高\n\n### 热力学第二定律\n**开尔文表述**：不可能从单一热源吸取热量，使之完全变为有用功而不产生其他影响。\n\n**克劳修斯表述**：不可能把热量从低温物体传到高温物体而不引起其他变化。\n\n**统计意义**：孤立系统内部所发生的过程总是向着热力学概率增大的方向进行。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Ld\",null,{\"module\":{\"id\":\"university-physics\",\"name\":\"大学物理\",\"category\":\"physics\",\"icon\":\"🌌\",\"color\":\"from-purple-400 to-purple-600\",\"description\":\"大学普通物理，深入理解物理原理和数学工具\",\"topics\":[{\"id\":\"up-1\",\"title\":\"质点运动学\",\"difficulty\":3,\"content\":\"## 质点运动学\\n\\n### 位置矢量与位移\\n**位置矢量（位矢）**：r = xi + yj + zk\\n- 描述质点在空间的位置\\n\\n**运动方程**：r = r(t) 或 x=x(t), y=y(t), z=z(t)\\n\\n**位移**：Δr = r(t+Δt) - r(t)\\n\\n### 速度与加速度\\n**速度**：v = dr/dt = ẋi + ẏj + żk\\n- 速率：v = |v| = ds/dt\\n\\n**加速度**：a = dv/dt = d²r/dt² = ẍi + ÿj + z̈k\\n\\n**切向加速度与法向加速度**：\\n- 切向加速度：aₜ = dv/dt，改变速度大小\\n- 法向加速度：aₙ = v²/ρ，改变速度方向（ρ为曲率半径）\\n- 总加速度：a = √(aₜ² + aₙ²)\\n\\n### 常见运动\\n**直线运动**：\\n- 匀速直线运动：x = x₀ + vt\\n- 匀变速直线运动：x = x₀ + v₀t + (1/2)at²\\n\\n**圆周运动**：\\n- 角速度：ω = dθ/dt\\n- 角加速度：α = dω/dt\\n- 线速度与角速度关系：v = Rω\\n- 向心加速度：aₙ = v²/R = Rω²\\n\\n**抛体运动**：\\n- 水平方向：匀速运动\\n- 竖直方向：匀变速运动\\n\\n### 相对运动\\n**伽利略变换**：\\n- r = r' + R\\n- v = v' + u（绝对速度 = 相对速度 + 牵连速度）\\n- a = a'（加速度在相对运动参考系中不变）\"},{\"id\":\"up-2\",\"title\":\"刚体力学\",\"difficulty\":4,\"content\":\"## 刚体力学\\n\\n### 刚体的运动\\n**平动**：刚体内各点运动相同，可用质点运动描述\\n\\n**定轴转动**：\\n- 各点绕同一轴做圆周运动\\n- 角位移θ、角速度ω、角加速度α\\n\\n### 刚体定轴转动的运动学\\n**匀变速转动**：\\n- ω = ω₀ + αt\\n- θ = ω₀t + (1/2)αt²\\n- ω² - ω₀² = 2αθ\\n\\n**角量与线量的关系**：\\n- v = rω\\n- aₜ = rα\\n- aₙ = rω²\\n\\n### 刚体定轴转动的动力学\\n**力矩**：M = r×F，大小M = Fd（d为力臂）\\n\\n**转动定律**：M = Jα\\n- J：转动惯量\\n- 类比：F=ma，力矩对应力，转动惯量对应质量，角加速度对应加速度\\n\\n### 转动惯量\\n**定义**：J = Σmᵢrᵢ² 或 J = ∫r²dm\\n\\n**常见刚体的转动惯量**：\\n- 细杆（绕中心）：J = (1/12)mL²\\n- 细杆（绕端点）：J = (1/3)mL²\\n- 圆环（绕中心轴）：J = mR²\\n- 圆盘（绕中心轴）：J = (1/2)mR²\\n- 球体（绕直径）：J = (2/5)mR²\\n\\n**平行轴定理**：J = Jc + md²\\n- Jc：绕质心轴的转动惯量\\n- d：两轴之间的距离\\n\\n### 角动量\\n**定义**：L = Jω（定轴转动）\\n\\n**角动量定理**：M = dL/dt\\n\\n**角动量守恒定律**：当M=0时，L=常量\\n\\n### 刚体的动能\\n**转动动能**：Eₖ = (1/2)Jω²\\n\\n**刚体平面运动动能**：\\nEₖ = (1/2)mv²c + (1/2)Jcω²\\n（平动动能 + 转动动能）\"},{\"id\":\"up-3\",\"title\":\"振动与波\",\"difficulty\":4,\"content\":\"## 振动与波\\n\\n### 简谐振动\\n**运动学方程**：\\n- x = Acos(ωt + φ)\\n- v = -Aωsin(ωt + φ)\\n- a = -Aω²cos(ωt + φ) = -ω²x\\n\\n**特征量**：\\n- 振幅A：最大位移的绝对值\\n- 角频率ω：ω = 2π/T = 2πf\\n- 周期T：完成一次全振动的时间\\n- 频率f：单位时间内全振动的次数\\n- 相位(ωt+φ)：描述振动状态\\n- 初相φ：t=0时的相位\\n\\n**参考圆**：用匀速圆周运动的投影描述简谐振动\\n\\n**能量**：\\n- 动能：Eₖ = (1/2)mω²A²sin²(ωt+φ)\\n- 势能：Eₚ = (1/2)kA²cos²(ωt+φ)\\n- 总能量：E = (1/2)kA² = (1/2)mω²A²（守恒）\\n\\n### 常见简谐振动系统\\n**弹簧振子**：\\n- ω = √(k/m)\\n- T = 2π√(m/k)\\n\\n**单摆**（小角度）：\\n- ω = √(g/l)\\n- T = 2π√(l/g)\\n\\n### 阻尼振动与受迫振动\\n**阻尼振动**：振幅随时间减小的振动\\n- 欠阻尼、过阻尼、临界阻尼\\n\\n**受迫振动**：系统在周期性外力作用下的振动\\n- 稳态时振动频率等于驱动力频率\\n\\n**共振**：当驱动力频率接近系统固有频率时，振幅达到最大。\\n\\n### 机械波\\n**描述波的物理量**：\\n- 波长λ：相邻同相位点间的距离\\n- 频率f：波的频率等于波源的振动频率\\n- 波速u：u = λf = λ/T\\n\\n**平面简谐波的波动方程**：\\ny = Acos[ω(t ∓ x/u) + φ]\\n- \\\"-\\\"表示沿x正方向传播\\n- \\\"+\\\"表示沿x负方向传播\\n\\n**波的能量**：\\n- 动能与势能同相变化\\n- 能量密度：w = ρω²A²sin²[ω(t-x/u)+φ]\\n- 平均能量密度：w̄ = (1/2)ρω²A²\\n\\n**波的干涉**：\\n- 相干条件：频率相同、振动方向相同、相位差恒定\\n- 干涉加强：Δφ = 2kπ，A = A₁+A₂\\n- 干涉减弱：Δφ = (2k+1)π，A = |A₁-A₂|\\n\\n**驻波**：两列振幅相同、传播方向相反的相干波叠加形成。\\n- 波节：振幅始终为零的点\\n- 波腹：振幅最大的点\"},{\"id\":\"up-4\",\"title\":\"热力学基础\",\"difficulty\":4,\"content\":\"$e\"},{\"id\":\"up-5\",\"title\":\"电磁场理论\",\"difficulty\":5,\"content\":\"## 电磁场理论\\n\\n### 静电场的高斯定理\\n**电通量**：Φᴇ = ∮E·dS\\n\\n**高斯定理**：∮E·dS = Q/ε₀\\n- 电场强度对任意封闭曲面的通量等于该曲面内电荷的代数和除以ε₀\\n\\n**应用**：\\n- 均匀带电球面：球内E=0，球外E = kQ/r²\\n- 无限长均匀带电直线：E = λ/(2πε₀r)\\n- 无限大均匀带电平面：E = σ/(2ε₀)\\n\\n### 静电场的环路定理\\n**环路定理**：∮E·dl = 0\\n- 静电场是保守场，电场力做功与路径无关\\n\\n**电势**：\\n- Uᴀ = ∫ᴀ^∞ E·dl\\n- Uᴀʙ = Uᴀ - Uʙ = ∫ᴀʙ E·dl\\n\\n### 稳恒磁场的高斯定理与安培环路定理\\n**磁场高斯定理**：∮B·dS = 0\\n- 磁场是无源场，磁感应线闭合\\n\\n**安培环路定理**：∮B·dl = μ₀ΣI\\n- 磁感应强度沿任意闭合曲线的线积分等于穿过该曲线所围曲面的电流的代数和乘以μ₀\\n\\n**应用**：\\n- 长直螺线管内部：B = μ₀nI\\n- 环形螺线管内部：B = μ₀NI/(2πr)\\n- 无限长载流圆柱导体\\n\\n### 电磁感应\\n**法拉第电磁感应定律**：\\nε = -dΦ/dt\\n- 负号表示感应电动势的方向（楞次定律）\\n\\n**动生电动势**：\\nε = ∫(v×B)·dl\\n\\n**感生电动势与感生电场**：\\nε = ∮E感·dl = -∫(∂B/∂t)·dS\\n- 变化的磁场产生涡旋电场（感生电场）\\n\\n### 位移电流与麦克斯韦方程组\\n**位移电流**：Iᴅ = dΦᴅ/dt = ε₀dΦᴇ/dt\\n- 变化的电场等效为一种电流\\n\\n**全电流安培环路定理**：\\n∮H·dl = I + Iᴅ = ∫(j + ∂D/∂t)·dS\\n\\n**麦克斯韦方程组（积分形式）**：\\n1. ∮D·dS = ∫ρdV （电场的高斯定理）\\n2. ∮B·dS = 0 （磁场的高斯定理）\\n3. ∮E·dl = -∫(∂B/∂t)·dS （法拉第电磁感应定律）\\n4. ∮H·dl = ∫(j + ∂D/∂t)·dS （全电流安培环路定理）\\n\\n**物理意义**：变化的电场产生磁场，变化的磁场产生电场，电磁波可以在真空中传播。\"},{\"id\":\"up-6\",\"title\":\"光学\",\"difficulty\":4,\"content\":\"## 光学\\n\\n### 光的干涉\\n**相干条件**：频率相同、振动方向相同、相位差恒定\\n\\n**光程**：L = nr（n为介质折射率，r为几何路程）\\n- 光程差与相位差关系：Δφ = (2π/λ)δ\\n\\n**杨氏双缝干涉**：\\n- 明纹位置：x = ±k(D/d)λ (k=0,1,2,...)\\n- 暗纹位置：x = ±(2k+1)(D/d)(λ/2)\\n- 条纹间距：Δx = (D/d)λ\\n\\n**薄膜干涉**：\\n- 光程差：δ = 2nd + λ/2（考虑半波损失）\\n- 增透膜、增反膜原理\\n\\n**劈尖干涉与牛顿环**：\\n- 劈尖：等厚干涉条纹，平行于棱边的直条纹\\n- 牛顿环：同心圆环，内疏外密\\n\\n### 光的衍射\\n**惠更斯-菲涅尔原理**：波前上每一点都可以看作新的子波源，空间任一点的振动是所有子波在该点相干叠加的结果。\\n\\n**单缝夫琅禾费衍射**：\\n- 明纹：asinθ = ±(2k+1)λ/2\\n- 暗纹：asinθ = ±kλ\\n- 中央明纹宽度：Δx = 2fλ/a\\n\\n**圆孔衍射与光学仪器分辨率**：\\n- 艾里斑：圆孔衍射的中央亮斑\\n- 瑞利判据：最小分辨角 θ = 1.22λ/D\\n\\n**光栅衍射**：\\n- 光栅方程：d(sinθ ± sini) = kλ\\n- 光栅光谱\\n\\n### 光的偏振\\n**自然光与偏振光**：\\n- 自然光：光矢量在各个方向均匀分布\\n- 线偏振光：光矢量只沿一个固定方向振动\\n- 部分偏振光\\n\\n**马吕斯定律**：I = I₀cos²θ\\n- θ：偏振光振动方向与偏振片偏振化方向的夹角\\n\\n**布儒斯特定律**：\\n- 当入射角满足tan i₀ = n₂/n₁时，反射光为完全偏振光\\n- i₀：布儒斯特角或起偏角\\n- 此时反射光与折射光垂直\\n\\n**双折射现象**：\\n- 一束光入射到各向异性晶体中分为两束\\n- o光（寻常光）与e光（非常光）\"},{\"id\":\"up-7\",\"title\":\"近代物理基础\",\"difficulty\":5,\"content\":\"## 近代物理基础\\n\\n### 狭义相对论基础\\n**基本原理**：\\n1. 相对性原理：物理定律在所有惯性系中形式相同\\n2. 光速不变原理：真空中的光速与光源或观察者的运动无关\\n\\n**洛伦兹变换**：\\nx' = γ(x - vt)\\nt' = γ(t - vx/c²)\\n其中 γ = 1/√(1-v²/c²)（洛伦兹因子）\\n\\n**时间膨胀**：\\nΔt = γΔt₀（Δt₀为固有时间）\\n- 运动的时钟变慢\\n\\n**长度收缩**：\\nl = l₀/γ（l₀为固有长度）\\n- 运动的尺子缩短\\n\\n**相对论质量与质能关系**：\\n- 相对论质量：m = γm₀\\n- 质能方程：E = mc²\\n- 相对论动能：Eₖ = mc² - m₀c²\\n- 能量动量关系：E² = p²c² + m₀²c⁴\\n\\n### 光的量子性\\n**黑体辐射**：\\n- 普朗克量子假设：E = hν\\n- 能量是量子化的\\n\\n**光电效应**：\\n- 爱因斯坦光电方程：hν = (1/2)mv²ₘₐₓ + W\\n- W：逸出功\\n- 截止频率：ν₀ = W/h\\n- 光具有粒子性\\n\\n**康普顿效应**：\\n- X射线被物质散射后波长变长\\n- Δλ = λc(1-cosθ)，λc = h/(mₑc)为康普顿波长\\n\\n### 原子结构\\n**氢原子光谱**：\\n- 里德伯公式：1/λ = R(1/m² - 1/n²)\\n- 赖曼系、巴耳末系、帕邢系等\\n\\n**玻尔氢原子理论**：\\n1. 定态假设：电子在特定轨道上运动时不辐射能量\\n2. 频率条件：hν = Eₙ - Eₘ\\n3. 角动量量子化：L = nħ (n=1,2,3,...)\\n\\n**氢原子能级**：\\nEₙ = -13.6/n² eV\\n\\n### 量子力学基础\\n**德布罗意波（物质波）**：\\nλ = h/p = h/(mv)\\n- 一切实物粒子都具有波粒二象性\\n\\n**不确定性原理**：\\nΔx·Δpₓ ≥ ħ/2\\n- 不可能同时精确确定粒子的位置和动量\\n\\n**波函数**：\\n- 描述微观粒子运动状态的函数Ψ(r,t)\\n- 统计解释：|Ψ|²表示粒子出现的概率密度\\n- 满足归一化条件：∫|Ψ|²dV = 1\\n\\n**薛定谔方程**：\\n- 定态薛定谔方程：[-(ħ²/2m)∇² + V]ψ = Eψ\\n- 一维无限深势阱、势垒穿透、谐振子\"}]},\"moduleId\":\"university-physics\"}]\n"])</script><script>self.__next_f.push([1,"9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"f:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/bd395c328f5600f0.js\"],\"IconMark\"]\n7:null\nb:[[\"$\",\"title\",\"0\",{\"children\":\"欧拉登基之路 - 理科学习交流平台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"针对高中及大学的理科教学沟通互动平台，包含数学、物理、计算机等科目的知识库和每日一题挑战\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"数学,物理,计算机,学习,教育,每日一题,论坛\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Lf\",\"4\",{}]]\n"])</script></body></html>
