color\":\"from-blue-400 to-blue-600\",\"description\":\"高中数学知识体系，涵盖代数、几何、三角函数、数列等内容\",\"topics\":[{\"id\":\"hm-1\",\"title\":\"函数与方程\",\"difficulty\":2,\"content\":\"## 函数与方程\\n\\n### 核心概念\\n- **函数的定义**：设A、B是非空的数集，如果按照某种确定的对应关系f，使对于集合A中的任意一个数x，在集合B中都有唯一确定的数f(x)和它对应，那么就称f：A→B为从集合A到集合B的一个函数。\\n\\n### 重要知识点\\n1. **函数的三要素**：定义域、值域、对应关系\\n2. **函数的表示方法**：解析法、列表法、图像法\\n3. **函数的性质**：单调性、奇偶性、周期性、对称性\\n\\n### 常见函数类型\\n- 一次函数：y = kx + b (k≠0)\\n- 二次函数：y = ax² + bx + c (a≠0)\\n- 指数函数：y = aˣ (a\u003e0, a≠1)\\n- 对数函数：y = logₐx (a\u003e0, a≠1)\\n\\n### 方程求解\\n- 一元一次方程、一元二次方程\\n- 高次方程与因式分解\\n- 函数零点与方程根的关系\"},{\"id\":\"hm-2\",\"title\":\"三角函数\",\"difficulty\":3,\"content\":\"## 三角函数\\n\\n### 基本概念\\n- **弧度制**：弧长等于半径的弧所对的圆心角为1弧度\\n- **任意角的三角函数**：设α是一个任意角，它的终边与单位圆交于点P(x,y)\\n  - sin α = y\\n  - cos α = x\\n  - tan α = y/x (x≠0)\\n\\n### 重要公式\\n**诱导公式**：\\n- sin(π/2 ± α) = cos α\\n- cos(π/2 ± α) = ∓sin α\\n- sin(π ± α) = ∓sin α\\n- cos(π ± α) = -cos α\\n\\n**和差角公式**：\\n- sin(α ± β) = sin α cos β ± cos α sin β\\n- cos(α ± β) = cos α cos β ∓ sin α sin β\\n\\n**二倍角公式**：\\n- sin 2α = 2 sin α cos α\\n- cos 2α = cos²α - sin²α = 2cos²α - 1 = 1 - 2sin²α\\n\\n### 函数图像与性质\\n- y = sin x：周期2π，奇函数\\n- y = cos x：周期2π，偶函数\\n- y = tan x：周期π，奇函数\"},{\"id\":\"hm-3\",\"title\":\"数列与数学归纳法\",\"difficulty\":3,\"content\":\"## 数列与数学归纳法\\n\\n### 等差数列\\n- **通项公式**：aₙ = a₁ + (n-1)d\\n- **前n项和**：Sₙ = n(a₁ + aₙ)/2 = na₁ + n(n-1)d/2\\n- **性质**：若m+n=p+q，则aₘ+aₙ=aₚ+aq\\n\\n### 等比数列\\n- **通项公式**：aₙ = a₁ · q^(n-1) (q≠0)\\n- **前n项和**：\\n  - q=1时，Sₙ = na₁\\n  - q≠1时，Sₙ = a₁(1-qⁿ)/(1-q)\\n- **性质**：若m+n=p+q，则aₘ·aₙ=aₚ·aq\\n\\n### 数列求和方法\\n1. **公式法**：等差、等比数列直接用公式\\n2. **裂项相消法**：如 1/[n(n+1)] = 1/n - 1/(n+1)\\n3. **错位相减法**：适用于等差×等比型数列\\n4. **分组求和法**\\n\\n### 数学归纳法\\n证明步骤：\\n1. **归纳基础**：证明n=n₀时命题成立\\n2. **归纳假设**：假设n=k(k≥n₀)时命题成立\\n3. **归纳递推**：证明n=k+1时命题也成立\"},{\"id\":\"hm-4\",\"title\":\"立体几何\",\"difficulty\":3,\"content\":\"## 立体几何\\n\\n### 空间几何体\\n**柱体**：\\n- 体积：V = S底 · h\\n- 侧面积：S侧 = C底 · h（直棱柱）\\n\\n**锥体**：\\n- 体积：V = (1/3)S底 · h\\n- 正棱锥侧面积：S侧 = (1/2)C底 · l（l为斜高）\\n\\n**球体**：\\n- 体积：V = (4/3)πR³\\n- 表面积：S = 4πR²\\n\\n### 点线面位置关系\\n**平面的基本性质**：\\n- 公理1：如果一条直线上的两点在一个平面内，那么这条直线在此平面内\\n- 公理2：过不在一条直线上的三点，有且只有一个平面\\n- 公理3：如果两个不重合的平面有一个公共点，那么它们有且只有一条过该点的公共直线\\n\\n### 平行与垂直\\n**线面平行判定**：平面外一条直线与此平面内的一条直线平行，则该直线与此平面平行\\n\\n**线面垂直判定**：一条直线与一个平面内的两条相交直线都垂直，则该直线与此平面垂直\\n\\n**面面垂直判定**：一个平面过另一个平面的垂线，则这两个平面垂直\\n\\n### 空间向量（选学）\\n- 空间向量的坐标运算\\n- 用向量法求空间角：异面直线所成角、线面角、二面角\"},{\"id\":\"hm-5\",\"title\":\"解析几何\",\"difficulty\":4,\"content\":\"## 解析几何\\n\\n### 直线与方程\\n**直线方程的形式**：\\n- 点斜式：y - y₀ = k(x - x₀)\\n- 斜截式：y = kx + b\\n- 两点式：(y-y₁)/(y₂-y₁) = (x-x₁)/(x₂-x₁)\\n- 一般式：Ax + By + C = 0 (A²+B²≠0)\\n\\n**位置关系**：\\n- 平行：k₁ = k₂ 且 b₁ ≠ b₂\\n- 垂直：k₁ · k₂ = -1\\n\\n**距离公式**：\\n- 两点间距离：|P₁P₂| = √[(x₂-x₁)² + (y₂-y₁)²]\\n- 点到直线距离：d = |Ax₀ + By₀ + C|/√(A²+B²)\\n\\n### 圆与方程\\n- **标准方程**：(x-a)² + (y-b)² = r²\\n- **一般方程**：x² + y² + Dx + Ey + F = 0 (D²+E²-4F\u003e0)\\n- **直线与圆的位置关系**：相交、相切、相离\\n\\n### 圆锥曲线\\n**椭圆**：x²/a² + y²/b² = 1 (a\u003eb\u003e0)\\n- 焦距：2c，其中c² = a² - b²\\n- 离心率：e = c/a (0\u003ce\u003c1)\\n\\n**双曲线**：x²/a² - y²/b² = 1\\n- 焦距：2c，其中c² = a² + b²\\n- 离心率：e = c/a (e\u003e1)\\n- 渐近线：y = ±(b/a)x\\n\\n**抛物线**：y² = 2px (p\u003e0)\\n- 焦点：(p/2, 0)\\n- 准线：x = -p/2\"},{\"id\":\"hm-6\",\"title\":\"概率与统计\",\"difficulty\":2,\"content\":\"## 概率与统计\\n\\n### 统计基础\\n**抽样方法**：\\n- 简单随机抽样：抽签法、随机数表法\\n- 系统抽样：等间隔抽样\\n- 分层抽样：按比例从各层抽样\\n\\n**用样本估计总体**：\\n- 频率分布表与频率分布直方图\\n- 众数：出现次数最多的数据\\n- 中位数：按大小排列后位于中间的数\\n- 平均数：x̄ = (x₁+x₂+...+xₙ)/n\\n- 方差：s² = [(x₁-x̄)²+(x₂-x̄)²+...+(xₙ-x̄)²]/n\\n- 标准差：s = √s²\\n\\n### 概率\\n**基本概念**：\\n- 随机事件、必然事件、不可能事件\\n- 概率的取值范围：0 ≤ P(A) ≤ 1\\n\\n**古典概型**：\\n- P(A) = A包含的基本事件数 / 基本事件总数\\n\\n**几何概型**：\\n- P(A) = 构成事件A的区域长度(面积或体积) / 试验的全部结果构成的区域长度(面积或体积)\\n\\n**概率公式**：\\n- 互斥事件：P(A∪B) = P(A) + P(B)\\n- 对立事件：P(A) + P(Ā) = 1\\n- 独立事件：P(A∩B) = P(A) · P(B)\"},{\"id\":\"hm-7\",\"title\":\"导数及其应用\",\"difficulty\":4,\"content\":\"## 导数及其应用\\n\\n### 导数的概念\\n- **定义**：f'(x₀) = lim(Δx→0) [f(x₀+Δx) - f(x₀)]/Δx\\n- **几何意义**：函数在某点处的导数等于该点处切线的斜率\\n\\n### 基本求导公式\\n- (C)' = 0 （C为常数）\\n- (xⁿ)' = nx^(n-1)\\n- (sin x)' = cos x\\n- (cos x)' = -sin x\\n- (eˣ)' = eˣ\\n- (aˣ)' = aˣ ln a\\n- (ln x)' = 1/x\\n- (logₐ x)' = 1/(x ln a)\\n\\n### 求导法则\\n- [f(x) ± g(x)]' = f'(x) ± g'(x)\\n- [f(x) · g(x)]' = f'(x)g(x) + f(x)g'(x)\\n- [f(x)/g(x)]' = [f'(x)g(x) - f(x)g'(x)]/g²(x) (g(x)≠0)\\n- 复合函数求导（链式法则）：[f(g(x))]' = f'(g(x)) · g'(x)\\n\\n### 导数的应用\\n**判断单调性**：\\n- f'(x) \u003e 0 → f(x)单调递增\\n- f'(x) \u003c 0 → f(x)单调递减\\n\\n**求极值**：\\n1. 求f'(x)\\n2. 求方程f'(x)=0的根\\n3. 检查f'(x)在根左右的符号变化\\n\\n**求最值**：比较极值与区间端点的函数值\\n\\n**切线方程**：y - f(x₀) = f'(x₀)(x - x₀)\"},{\"id\":\"hm-8\",\"title\":\"不等式\",\"difficulty\":3,\"content\":\"## 不等式\\n\\n### 不等式的基本性质\\n1. 对称性：a \u003e b ⇔ b \u003c a\\n2. 传递性：a \u003e b, b \u003e c ⇒ a \u003e c\\n3. 可加性：a \u003e b ⇔ a + c \u003e b + c\\n4. 可乘性：a \u003e b, c \u003e 0 ⇒ ac \u003e bc；a \u003e b, c \u003c 0 ⇒ ac \u003c bc\\n\\n### 基本不等式\\n**重要不等式**：\\n- a² + b² ≥ 2ab（当且仅当a=b时取等号）\\n- (a+b)/2 ≥ √ab，即算术平均数 ≥ 几何平均数（a\u003e0, b\u003e0）\\n- 推广：(a+b+c)/3 ≥ ³√abc（a,b,c\u003e0）\\n\\n**最值定理**：\\n- 若x+y=S（定值），则当x=y时，xy有最大值S²/4\\n- 若xy=P（定值），则当x=y时，x+y有最小值2√P\\n\\n### 常见不等式解法\\n**一元二次不等式**：\\n- ax² + bx + c \u003e 0 (a\u003e0)\\n- 结合二次函数图像求解\\n\\n**绝对值不等式**：\\n- |x| \u003c a (a\u003e0) ⇔ -a \u003c x \u003c a\\n- |x| \u003e a (a\u003e0) ⇔ x \u003c -a 或 x \u003e a\\n\\n**分式不等式**：\\n- 转化为整式不等式求解，注意分母不为零\\n\\n### 不等式证明方法\\n- 比较法（作差、作商）\\n- 综合法（由因导果）\\n- 分析法（执果索因）\\n- 反证法\"}]},\"moduleId\":\"highschool-math\"}]\n"])</script><script>self.__next_f.push([1,"9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"e:I[27201,[\"/_next/static/chunks/ff1a16fafef87110.js\",\"/_next/static/chunks/bd395c328f5600f0.js\"],\"IconMark\"]\n7:null\nb:[[\"$\",\"title\",\"0\",{\"children\":\"欧拉登基之路 - 理科学习交流平台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content
